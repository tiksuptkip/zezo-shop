<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg-kids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow-kids" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-pattern-kids" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg-kids)"/>
  <rect width="800" height="1000" fill="url(#grid-pattern-kids)"/>
  <circle cx="400" cy="400" r="340" fill="url(#glow-kids)"/>
  <rect x="30" y="30" width="740" height="940" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="8 8"/>
  <g transform="translate(400, 390)" text-anchor="middle">
    <!-- Category pill -->
    <rect x="-110" y="-120" width="220" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <text y="-96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#7dd3fc" text-transform="uppercase">KIDS CLOTHING</text>
    
    <!-- Big Coming Soon Text -->
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="#ffffff">COMING</text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="#38bdf8">SOON</text>
    
    <line x1="-70" y1="115" x2="70" y2="115" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
    <text y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#94a3b8">COLLECTION ARRIVING SOON</text>
  </g>
</svg>
